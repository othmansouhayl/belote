name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests du moteur
        run: npm test
      - name: Tests de sécurité de la base (Postgres local)
        run: ./scripts/test-db.sh
      - name: Simulation de 500 parties
        run: npm run simulate
      - name: Construction du site
        run: npm run build
