name: Déploiement Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'src/engine/**'
      - 'src/server/**'
      - 'src/voice/**'
      - 'scripts/sync-edge-shared.mjs'
      - '.github/workflows/supabase.yml'
  workflow_dispatch:

concurrency:
  group: supabase
  cancel-in-progress: false

jobs:
  deploy:
    # Ne s'exécute que lorsque les variables Supabase ont été créées (voir docs/SUPABASE.md).
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests du moteur et des salons
        run: npm test
      - name: Tests de sécurité de la base
        run: ./scripts/test-db.sh
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Liaison au projet Supabase
        run: supabase link --project-ref "$PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"
      - name: Tables et règles de sécurité
        run: supabase --yes db push --password "$SUPABASE_DB_PASSWORD"
      - name: Secrets du serveur TURN (facultatif, voir docs/VOCAL.md)
        env:
          TURN_URLS: ${{ secrets.TURN_URLS }}
          TURN_USERNAME: ${{ secrets.TURN_USERNAME }}
          TURN_CREDENTIAL: ${{ secrets.TURN_CREDENTIAL }}
          CLOUDFLARE_TURN_KEY_ID: ${{ secrets.CLOUDFLARE_TURN_KEY_ID }}
          CLOUDFLARE_TURN_API_TOKEN: ${{ secrets.CLOUDFLARE_TURN_API_TOKEN }}
        run: |
          env_file="$(mktemp)"
          for name in TURN_URLS TURN_USERNAME TURN_CREDENTIAL CLOUDFLARE_TURN_KEY_ID CLOUDFLARE_TURN_API_TOKEN; do
            if [ -n "${!name}" ]; then printf '%s=%s\n' "$name" "${!name}" >> "$env_file"; fi
          done
          if [ -s "$env_file" ]; then
            supabase secrets set --project-ref "$PROJECT_ID" --env-file "$env_file"
          else
            echo "Aucun serveur TURN configuré : le vocal utilisera seulement STUN."
          fi
          rm -f "$env_file"
      - name: Copie du moteur pour la fonction serveur
        run: node scripts/sync-edge-shared.mjs
      - name: Fonction serveur « game »
        run: supabase functions deploy game --project-ref "$PROJECT_ID" --no-verify-jwt
